name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    permissions:
      contents: write
      pull-requests: write
    uses: Primajin/.github/.github/workflows/reusable-release-please.yml@v1

# Note: publishing a GitHub Action release to GitHub Marketplace is still a manual UI step.
# GitHub documents this as the release-form checkbox "Publish this Action to the GitHub Marketplace".
# There is no supported REST, GraphQL, or release-please option to automate it.
