name: 'WebApp Console Log Action'
description: 'An action to capture and post console logs from a web application'
author: 'Jannis Hell (@Primajin)'

branding:
  icon: 'clipboard'
  color: 'blue'

inputs:
  artifact-name:
    description: 'The name of the artifact to download'
    required: false
  comment-tag:
    description: 'The tag to use for the comment - so it can be replaced, you may pass empty string to always post a new comment'
    required: false
    default: 'console-log'
  headline:
    description: 'The headline for the console logs comment'
    required: false
    default: 'Console Logs'
  max-log-level:
    description: 'The maximum log level to allow (verbose, info, warning, error). Set to error to disable failing.'
    required: false
    default: 'info'
  min-log-level:
    description: 'The minimum log level to capture (verbose, info, warning, error)'
    required: false
    default: 'verbose'
  pre-script-path:
    description: 'Path to a JavaScript pre-script that can log in or prepare the app before console capture'
    required: false
  pre-script-timeout:
    description: 'Timeout in milliseconds for the pre-script'
    required: false
    default: '30000'
  port:
    description: 'The port to run the http-server on'
    required: false
  regexp-error:
    description: 'Regular expression pattern to filter error logs'
    required: false
  regexp-info:
    description: 'Regular expression pattern to filter info logs'
    required: false
  regexp-verbose:
    description: 'Regular expression pattern to filter verbose logs'
    required: false
  regexp-warning:
    description: 'Regular expression pattern to filter warning logs'
    required: false
  show-emoji:
    description: 'Whether to show emojis in the output'
    required: false
    default: 'true'
  validate-status:
    description: 'Whether to validate the HTTP response status code before log collection'
    required: false
    default: 'true'
  positive-statuses:
    description: 'Comma-separated list of HTTP status codes considered successful (e.g. "200,201"). Defaults to 200 when not set.'
    required: false
  negative-statuses:
    description: 'Comma-separated list of HTTP status codes that explicitly fail the action (e.g. "404,500"). Any code not in positive-statuses also fails by default.'
    required: false
  wait-time:
    description: 'The wait time before capturing logs'
    required: false
    default: '2500'
  webapp-url:
    description: 'The URL of the web application'
    required: true

outputs:
  console:
    description: 'The captured console log'
    value: ${{ steps.capture-console.outputs.console }}

runs:
  using: 'composite'
  steps:
    # Inputs reach the shell only through env: they are never interpolated into a script body.
    # This step decides once whether webapp-url is served from the runner (is-local); every later step uses that output.
    - name: Decide whether webapp-url is local and set the port
      id: set-port
      run: |
        # Only plain http on a loopback host is local: http-server cannot serve https, and a look-alike host
        # such as localhost.example.com or a "?next=http://localhost" in an external URL must not count.
        # Host names and the scheme are case-insensitive, so HTTP://LOCALHOST is local as well.
        shopt -s nocasematch
        is_local=false
        bind_address=
        local_url_pattern='^http://(localhost|127\.0\.0\.1|\[::1\])(:[0-9]*)?([/?#]|$)'
        if [[ "$WEBAPP_URL" =~ $local_url_pattern ]]; then
          is_local=true
          # http-server listens on IPv4 only by default, so [::1] needs the dual-stack address
          if [[ "${BASH_REMATCH[1]}" == '[::1]' ]]; then
            bind_address='::'
          fi
        fi
        port="$INPUT_PORT"
        if [[ -z "$port" && "$is_local" == true ]]; then
          port=3000
        fi
        # The port ends up in a command line and in the capture URL, so it has to be a plain number
        if [[ -n "$port" ]] && { [[ ! "$port" =~ ^[0-9]{1,5}$ ]] || (( 10#$port < 1 || 10#$port > 65535 )); }; then
          printf 'Error: port must be a whole number from 1 to 65535 (got %q).\n' "$port"
          exit 1
        fi
        {
          echo "is-local=$is_local"
          echo "port=$port"
          echo "bind-address=$bind_address"
        } >> "$GITHUB_OUTPUT"
      shell: bash
      env:
        INPUT_PORT: ${{ inputs.port }}
        WEBAPP_URL: ${{ inputs.webapp-url }}

    - name: Check artifact name requirement
      if: steps.set-port.outputs.is-local == 'true'
      run: |
        if [[ -z "$ARTIFACT_NAME" ]]; then
          echo "Error: artifact-name is required when webapp-url points to localhost."
          exit 1
        fi
      shell: bash
      env:
        ARTIFACT_NAME: ${{ inputs.artifact-name }}

    - name: Checkout Code
      uses: actions/checkout@v7

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24'

    - name: Install dependencies
      run: npm ci --omit=dev
      shell: bash
      working-directory: ${{ github.action_path }}

    - name: Resolve Playwright version
      id: playwright
      run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")" >> "$GITHUB_OUTPUT"
      shell: bash
      working-directory: ${{ github.action_path }}

    - name: Cache Playwright browsers
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

    - name: Setup Chromium
      run: npx playwright install chromium
      shell: bash
      working-directory: ${{ github.action_path }}

    - name: Download artifact
      if: steps.set-port.outputs.is-local == 'true'
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.artifact-name }}
        path: app

    - name: Run http-server in the background
      if: steps.set-port.outputs.is-local == 'true'
      run: |
        # http-server is a locked dependency of this action (not fetched with npx), it serves app/ of the caller's workspace
        log="$RUNNER_TEMP/http-server.log"
        args=(app/ -p "$PORT")
        if [[ -n "$BIND_ADDRESS" ]]; then
          args+=(-a "$BIND_ADDRESS")
        fi
        nohup "${GITHUB_ACTION_PATH}/node_modules/.bin/http-server" "${args[@]}" > "$log" 2>&1 &
        server_pid=$!
        for _ in $(seq 1 30); do
          if ! kill -0 "$server_pid" 2> /dev/null; then
            echo "Error: http-server exited before it was ready. Its output:"
            cat "$log"
            exit 1
          fi
          if curl --silent --output /dev/null "http://localhost:${PORT}/"; then
            exit 0
          fi
          sleep 1
        done
        echo "Error: http-server did not answer on port ${PORT} within 30 seconds. Its output:"
        cat "$log"
        exit 1
      shell: bash
      env:
        BIND_ADDRESS: ${{ steps.set-port.outputs.bind-address }}
        PORT: ${{ steps.set-port.outputs.port }}

    - name: Execute Capture Script
      run: node index.js
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        MAX_LOG_LEVEL: ${{ inputs.max-log-level }}
        MIN_LOG_LEVEL: ${{ inputs.min-log-level }}
        NEGATIVE_STATUSES: ${{ inputs.negative-statuses }}
        PORT: ${{ steps.set-port.outputs.port }}
        POSITIVE_STATUSES: ${{ inputs.positive-statuses }}
        PRE_SCRIPT_PATH: ${{ inputs.pre-script-path }}
        PRE_SCRIPT_TIMEOUT: ${{ inputs.pre-script-timeout }}
        REGEXP_ERROR: ${{ inputs.regexp-error }}
        REGEXP_INFO: ${{ inputs.regexp-info }}
        REGEXP_VERBOSE: ${{ inputs.regexp-verbose }}
        REGEXP_WARNING: ${{ inputs.regexp-warning }}
        VALIDATE_STATUS: ${{ inputs.validate-status }}
        WAIT_TIME: ${{ inputs.wait-time }}
        WEBAPP_URL: ${{ inputs.webapp-url }}

    - name: Set Output
      id: capture-console
      run: |
        echo 'console<<EOF' >> "$GITHUB_OUTPUT"
        jq -c . console_output.json >> "$GITHUB_OUTPUT"
        echo 'EOF' >> "$GITHUB_OUTPUT"
      shell: bash
      working-directory: ${{ github.action_path }}

    - name: Format Console Output  # Step to format the console output into GitHub Flavored Markdown
      id: format_console_output
      run: |
        # Create a markdown file and add a main heading
        echo "# $HEADLINE" > formatted_console_output.md
        # Check if there is an early-exit reason (e.g. HTTP status validation failure)
        if [ -n "$SHOULD_FAIL_REASON" ]; then
          if [ "$SHOW_EMOJI" = "true" ]; then
            echo "❌ $SHOULD_FAIL_REASON" >> formatted_console_output.md
          else
            echo "$SHOULD_FAIL_REASON" >> formatted_console_output.md
          fi
        # Check if the console_output.json file is empty or contains no logs
        elif [ ! -s console_output.json ] || [ "$(jq -r 'keys | length' console_output.json)" -eq 0 ]; then
          total_observed=$(jq -r '.totalObserved' capture_stats.json 2>/dev/null || echo "0")
          if [ "$SHOW_EMOJI" = "true" ]; then
            if [ "$total_observed" -gt 0 ]; then
              echo "✅ No unexpected logs were captured" >> formatted_console_output.md
            else
              echo "✅ No logs were captured" >> formatted_console_output.md
            fi
          else
            if [ "$total_observed" -gt 0 ]; then
              echo "No unexpected logs were captured" >> formatted_console_output.md
            else
              echo "No logs were captured" >> formatted_console_output.md
            fi
          fi
        else
          # Loop through each key in the JSON file
          for key in $(jq -r 'keys[]' console_output.json); do
            # Capitalize the first character of the key
            capitalized_key=$(echo "$key" | awk '{print toupper(substr($0, 1, 1)) tolower(substr($0, 2))}')
            # Add a subheading for each log level with matching emoji if show-emoji is true
            if [ "$SHOW_EMOJI" = "true" ]; then
              case "$key" in
                verbose) emoji="💬" ;;
                info) emoji="ℹ️" ;;
                warning) emoji="⚠️" ;;
                error) emoji="❌" ;;
                *) emoji="" ;;
              esac
              echo "## $emoji $capitalized_key" >> formatted_console_output.md
            else
              echo "## $capitalized_key" >> formatted_console_output.md
            fi
            # Add a code block for each log message
            echo '```' >> formatted_console_output.md
            # Add each log message
            jq -r --arg key "$key" '.[$key][]' console_output.json >> formatted_console_output.md
            # Close the code block
            echo '```' >> formatted_console_output.md
            # Add an empty line for better readability when editing
            echo "" >> formatted_console_output.md
          done
        fi
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        HEADLINE: ${{ inputs.headline }}
        SHOULD_FAIL_REASON: ${{ env.SHOULD_FAIL_REASON }}
        SHOW_EMOJI: ${{ inputs.show-emoji }}

    - name: Post Console Output to PR
      if: github.event_name == 'pull_request'
      uses: thollander/actions-comment-pull-request@v3
      with:
        comment-tag: ${{ inputs.comment-tag }}
        file-path: ${{ github.action_path }}/formatted_console_output.md
      env:
        GITHUB_TOKEN: ${{ env.GITHUB_TOKEN }}

    - name: Check if action should fail
      run: |
        if [ "$SHOULD_FAIL_ACTION" = "true" ]; then
          if [ -n "$SHOULD_FAIL_REASON" ]; then
            echo "Action failed: $SHOULD_FAIL_REASON"
          else
            echo "Action should fail due to log level threshold."
          fi
          exit 1
        fi
      shell: bash
      env:
        SHOULD_FAIL_ACTION: ${{ env.SHOULD_FAIL_ACTION }}
        SHOULD_FAIL_REASON: ${{ env.SHOULD_FAIL_REASON }}
